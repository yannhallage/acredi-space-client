name: Build & Push Frontend

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

env:
  # Docker Hub
  IMAGE_NAME_DH: ${{ vars.DOCKERHUB_USERNAME }}/acredispace-prod-front

jobs:
  build-and-push:
    name: Build et push de l'image Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Convert GitHub owner to lowercase
        run: |
          echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME_DH }}:latest
            ${{ env.IMAGE_NAME_DH }}:${{ github.sha }}
            ghcr.io/${{ env.OWNER_LC }}/acredispace-prod-front:latest
            ghcr.io/${{ env.OWNER_LC }}/acredispace-prod-front:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
