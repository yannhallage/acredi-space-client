# ============================================================================
# Nginx INTERNE au conteneur Docker du frontend.
# Sert uniquement la SPA statique (fallback index.html).
# Le reverse-proxy /api et /ws + TLS sont assures par le Nginx SYSTEME du VPS.
# ============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Assets hashes par Vite : cache long et immuable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Ne pas mettre en cache l'index (sinon nouvelles versions invisibles)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Fallback SPA (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
