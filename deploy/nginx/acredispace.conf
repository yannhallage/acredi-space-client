# ============================================================================
# Nginx SYSTEME (VPS) - reverse-proxy frontal pour AcrediSpace
# A placer dans /etc/nginx/sites-available/acredispace.conf
# puis : ln -s /etc/nginx/sites-available/acredispace.conf /etc/nginx/sites-enabled/
#
# Remplace mondomaine.com par ton domaine et 8080 par le port reel du backend.
# Le bloc HTTPS (listen 443 ... ssl) est ajoute automatiquement par Certbot.
# ============================================================================

# Necessaire au proxy WebSocket (STOMP / SockJS sur /ws)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name mondomaine.com www.mondomaine.com;

    # Taille max des uploads de fichiers
    client_max_body_size 50M;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ----- API backend (Spring) -----
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ----- WebSocket STOMP / SockJS -----
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Timeouts longs pour garder la connexion temps-reel ouverte
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ----- Frontend -----
    # Option A (recommandee) : le front tourne dans un conteneur Docker
    # (image nginx:alpine) expose en local sur 127.0.0.1:8081.
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Option B (sans Docker) : servir directement le build statique.
    # Commente l'Option A ci-dessus et decommente le bloc suivant.
    #
    # root /var/www/acredispace/dist;
    # index index.html;
    #
    # location / {
    #     try_files $uri $uri/ /index.html;
    # }
    #
    # # Assets hashes : cache long
    # location /assets/ {
    #     expires 1y;
    #     add_header Cache-Control "public, immutable";
    # }
    #
    # # Ne pas mettre en cache l'index (sinon nouvelles versions invisibles)
    # location = /index.html {
    #     add_header Cache-Control "no-cache";
    # }
}
